<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Verificador QR Halloween Party 5.0</title>
  
  <!-- Estilos Argon / Bootstrap / Iconos -->
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    :root {
      --primary: #5e72e4;
      --success: #2dce89;
      --warning: #fb6340;
      --danger: #f5365c;
      --dark: #172b4d;
      --bg: #111322;
      --card-bg: #1e2238;
      --card-border: #2c3258;
      --text: #e9ecef;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      margin: 0;
      padding: 0 0 85px 0;
      font-family: 'Open Sans', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* Header */
    .header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(135deg, #1f1a3a 0%, #0d0e1a 100%);
      border-bottom: 1px solid var(--card-border);
    }
    .header-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .badge-event {
      background: rgba(251, 99, 64, 0.2);
      color: var(--warning);
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
    }

    /* Contadores */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 12px 16px;
    }
    .stat-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 10px 4px;
      text-align: center;
    }
    .stat-label {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      color: #8898aa;
    }
    .stat-val {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 2px;
    }

    /* Secciones */
    .view-section { display: none; padding: 12px 16px; }
    .view-section.active { display: block; }

    /* Lector QR */
    #reader-container {
      position: relative;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--card-border);
      margin-bottom: 16px;
      min-height: 260px;
    }
    #reader { width: 100%; }

    /* Estado de Validación */
    .result-box {
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      background: var(--card-bg);
      border: 2px solid var(--card-border);
      transition: all 0.25s ease;
    }
    .result-box.valid { border-color: var(--success); background: rgba(45, 206, 137, 0.12); }
    .result-box.duplicate { border-color: var(--warning); background: rgba(251, 99, 64, 0.12); }
    .result-box.invalid { border-color: var(--danger); background: rgba(245, 54, 92, 0.12); }
    .result-box.link-mode { border-color: var(--primary); background: rgba(94, 114, 228, 0.12); }

    .result-icon { font-size: 2.8rem; margin-bottom: 8px; }
    .result-status {
      font-size: 0.95rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px; margin-bottom: 6px;
    }
    .result-name { font-size: 1.25rem; font-weight: 700; color: #fff; word-break: break-word; }
    .result-detail { font-size: 0.82rem; color: #adb5bd; margin-top: 6px; }

    /* Formularios y Botones */
    .btn {
      width: 100%; padding: 12px 16px; border-radius: 10px;
      border: none; font-size: 0.9rem; font-weight: 600;
      cursor: pointer; display: flex; align-items: center;
      justify-content: center; gap: 8px; margin-top: 10px;
    }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-success { background: var(--success); color: #fff; }
    .btn-warning { background: var(--warning); color: #fff; }
    .btn-danger { background: var(--danger); color: #fff; }

    .argon-select {
      width: 100%; padding: 12px; background: #111322; color: #fff;
      border: 1px solid var(--primary); border-radius: 8px;
      font-size: 0.95rem; margin: 10px 0; outline: none;
    }

    textarea {
      width: 100%; height: 140px; background: #151829;
      border: 1px solid var(--card-border); border-radius: 10px;
      color: #fff; padding: 10px; font-family: inherit; font-size: 0.85rem; margin-top: 8px;
    }

    /* Tabla / Lista */
    .guest-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; max-height: 55vh; overflow-y: auto; }
    .guest-item {
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 10px; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center;
    }
    .guest-item.in { border-left: 4px solid var(--success); }
    .guest-name { font-weight: 600; font-size: 0.9rem; }
    .guest-sub { font-size: 0.72rem; color: #8898aa; }

    /* Barra inferior estilo iOS */
    .nav-tabs {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(17, 19, 34, 0.94); backdrop-filter: blur(12px);
      border-top: 1px solid var(--card-border); display: flex; justify-content: space-around;
      padding: 8px 0 env(safe-area-inset-bottom, 12px); z-index: 100;
    }
    .nav-btn {
      background: none; border: none; color: #8898aa; font-size: 0.7rem;
      display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer;
    }
    .nav-btn i { font-size: 1.15rem; }
    .nav-btn.active { color: var(--primary); }
  </style>
</head>
<body>

  <header class="header">
    <div class="header-title">
      <i class="fa-solid fa-ghost" style="color: var(--warning)"></i>
      <span>Validador Halloween</span>
    </div>
    <span class="badge-event">Party 5.0</span>
  </header>

  <!-- Métricas rápidas -->
  <div class="stats-grid">
    <div class="stat-card"><div class="stat-label">Lista</div><div class="stat-val" id="stat-total" style="color:#5e72e4;">0</div></div>
    <div class="stat-card"><div class="stat-label">Adentro</div><div class="stat-val" id="stat-in" style="color:#2dce89;">0</div></div>
    <div class="stat-card"><div class="stat-label">Faltan</div><div class="stat-val" id="stat-left" style="color:#fb6340;">0</div></div>
    <div class="stat-card"><div class="stat-label">Alertas</div><div class="stat-val" id="stat-alerts" style="color:#f5365c;">0</div></div>
  </div>

  <!-- VISTA 1: ESCÁNER QR -->
  <main id="view-scanner" class="view-section active">
    <div id="reader-container">
      <div id="reader"></div>
    </div>

    <button class="btn btn-primary" id="btn-toggle-cam" onclick="toggleCamera()">
      <i class="fa-solid fa-camera"></i> Iniciar Cámara
    </button>

    <div style="margin-top: 14px;">
      <div class="result-box" id="result-box">
        <div class="result-icon" id="res-icon"><i class="fa-solid fa-qrcode"></i></div>
        <div class="result-status" id="res-status" style="color: #adb5bd;">Listo para escanear</div>
        <div class="result-name" id="res-name">Apunta al código QR</div>
        <div class="result-detail" id="res-detail"></div>
        
        <!-- Interfaz de Vinculación Manual -->
        <div id="link-ui" style="display:none; margin-top: 15px; text-align: left; padding-top: 15px; border-top: 1px solid var(--card-border);">
          <div style="font-size:0.85rem; color:#fff; font-weight: 600; margin-bottom: 8px;">¿A quién pertenece esta entrada?</div>
          <select id="link-guest-select" class="argon-select"></select>
          <div style="display: flex; gap: 10px;">
             <button class="btn btn-success" style="flex: 1; margin-top:0;" onclick="linkAndAdmit()">Autorizar</button>
             <button class="btn btn-danger" style="flex: 1; margin-top:0;" onclick="cancelLink()">Cancelar</button>
          </div>
        </div>

      </div>
    </div>
  </main>

  <!-- VISTA 2: LISTA DE REGISTRADOS -->
  <main id="view-list" class="view-section">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin: 0; font-size: 1rem;">Asistentes Registrados</h3>
      <span id="badge-count" style="font-size:0.75rem; color:#8898aa;">0 personas</span>
    </div>
    <div class="guest-list" id="guest-items-container"></div>
  </main>

  <!-- VISTA 3: IMPORTAR DATOS -->
  <main id="view-import" class="view-section">
    <h3 style="margin-top:0; font-size: 1rem;">Cargar Lista de Google Forms</h3>
    <label style="font-size:0.8rem; color:#adb5bd;">Opción A: Subir archivo CSV de respuestas</label>
    <input type="file" id="csv-file-input" accept=".csv" style="margin: 8px 0; width:100%; color:#adb5bd;" onchange="handleCSVFile(event)">
    <div style="margin: 16px 0; text-align: center; color: #8898aa; font-size: 0.8rem;">— O BIEN —</div>
    <label style="font-size:0.8rem; color:#adb5bd;">Opción B: Pegar columnas (Nombres y Apellidos)</label>
    <textarea id="paste-input" placeholder="Pega aquí la lista de nombres..."></textarea>
    <button class="btn btn-success" onclick="processPastedText()">Procesar Lista</button>
    <button class="btn btn-warning" onclick="clearData()" style="margin-top: 14px;">Borrar Todo y Reiniciar</button>
  </main>

  <!-- VISTA 4: HISTORIAL -->
  <main id="view-history" class="view-section">
    <h3 style="margin-top:0; font-size: 1rem;">Historial de Escaneos</h3>
    <div class="guest-list" id="scan-log-container"></div>
  </main>

  <!-- Navegación Inferior -->
  <nav class="nav-tabs">
    <button class="nav-btn active" onclick="switchTab('scanner', this)"><i class="fa-solid fa-qrcode"></i><span>Escáner</span></button>
    <button class="nav-btn" onclick="switchTab('list', this)"><i class="fa-solid fa-users"></i><span>Lista</span></button>
    <button class="nav-btn" onclick="switchTab('import', this)"><i class="fa-solid fa-file-arrow-up"></i><span>Importar</span></button>
    <button class="nav-btn" onclick="switchTab('history', this)"><i class="fa-solid fa-clock-rotate-left"></i><span>Historial</span></button>
  </nav>

  <script>
    let registeredGuests = JSON.parse(localStorage.getItem('hw_guests') || '[]');
    let scanLogs = JSON.parse(localStorage.getItem('hw_logs') || '[]');
    let urlCache = JSON.parse(localStorage.getItem('hw_url_cache') || '{}');
    let alertCount = parseInt(localStorage.getItem('hw_alerts') || '0');

    let html5QrCode = null;
    let cameraActive = false;
    let isProcessing = false;

    function cleanStr(str) {
      return (str || '').toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, " ").replace(/\s+/g, " ").trim();
    }

    function updateStats() {
      const total = registeredGuests.length;
      const inside = registeredGuests.filter(g => g.entered).length;
      document.getElementById('stat-total').textContent = total;
      document.getElementById('stat-in').textContent = inside;
      document.getElementById('stat-left').textContent = Math.max(0, total - inside);
      document.getElementById('stat-alerts').textContent = alertCount;
      document.getElementById('badge-count').textContent = `${total} registrados`;
      renderList();
      renderLogs();
    }

    function switchTab(viewId, btn) {
      document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      document.getElementById('view-' + viewId).classList.add('active');
      btn.classList.add('active');
    }

    async function toggleCamera() {
      const btn = document.getElementById('btn-toggle-cam');
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");

      if (cameraActive) {
        await html5QrCode.stop();
        cameraActive = false;
        btn.innerHTML = '<i class="fa-solid fa-camera"></i> Iniciar Cámara';
        btn.className = 'btn btn-primary';
      } else {
        try {
          await html5QrCode.start({ facingMode: "environment" }, { fps: 10, qrbox: { width: 230, height: 230 } }, onScanSuccess, () => {});
          cameraActive = true;
          btn.innerHTML = '<i class="fa-solid fa-stop"></i> Detener Cámara';
          btn.className = 'btn btn-warning';
        } catch (err) {
          alert("Error: Otorga permisos de cámara en Safari.");
        }
      }
    }

    async function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const box = document.getElementById('result-box');
      const icon = document.getElementById('res-icon');
      const status = document.getElementById('res-status');
      const nameEl = document.getElementById('res-name');
      const detail = document.getElementById('res-detail');
      
      // Ocultar UI de vinculación por defecto
      document.getElementById('link-ui').style.display = 'none';

      let query = decodedText.trim();

      // Si el enlace ya fue vinculado antes, reemplazarlo por el nombre
      if (urlCache[query]) {
         query = urlCache[query];
      }

      const cleanQuery = cleanStr(query);
      const foundIndex = registeredGuests.findIndex(g => {
        const full = cleanStr(g.fullName);
        const inv = cleanStr(g.lastName + ' ' + g.firstName);
        return full === cleanQuery || inv === cleanQuery || (cleanQuery.length > 5 && cleanQuery.includes(full));
      });

      const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

      if (foundIndex !== -1) {
        const guest = registeredGuests[foundIndex];
        if (guest.entered) {
          box.className = 'result-box duplicate';
          icon.innerHTML = '<i class="fa-solid fa-triangle-exclamation" style="color:var(--warning)"></i>';
          status.textContent = '¡Entrada Ya Utilizada!';
          status.style.color = 'var(--warning)';
          nameEl.textContent = guest.fullName;
          detail.textContent = `Ingresó previamente a las: ${guest.timeEntered}`;
          alertCount++;
          logScan('DUPLICADO', guest.fullName, now);
        } else {
          guest.entered = true;
          guest.timeEntered = now;
          localStorage.setItem('hw_guests', JSON.stringify(registeredGuests));

          box.className = 'result-box valid';
          icon.innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--success)"></i>';
          status.textContent = 'Acceso Autorizado';
          status.style.color = 'var(--success)';
          nameEl.textContent = guest.fullName;
          detail.textContent = `Verificado a las: ${now}`;
          logScan('ACCESO', guest.fullName, now);
        }
        setTimeout(() => { isProcessing = false; }, 3000);
      } else {
        if (query.includes('http') || query.includes('generatorqr')) {
           // MODO VINCULACIÓN MANUAL
           box.className = 'result-box link-mode';
           icon.innerHTML = '<i class="fa-solid fa-link" style="color:var(--primary)"></i>';
           status.textContent = 'NUEVO QR DETECTADO';
           status.style.color = 'var(--primary)';
           nameEl.textContent = 'Asignación Requerida';
           detail.textContent = 'Pregunta el nombre para vincular este código.';
           
           const select = document.getElementById('link-guest-select');
           select.innerHTML = '<option value="">-- Selecciona el invitado --</option>' + 
              registeredGuests.filter(g => !g.entered).map(g => `<option value="${g.fullName}">${g.fullName}</option>`).join('');
           select.setAttribute('data-url', decodedText.trim());
           
           document.getElementById('link-ui').style.display = 'block';
           // IMPORTANTE: No liberamos isProcessing aquí, esperamos que el usuario presione un botón.
        } else {
           box.className = 'result-box invalid';
           icon.innerHTML = '<i class="fa-solid fa-circle-xmark" style="color:var(--danger)"></i>';
           status.textContent = 'Acceso Denegado';
           status.style.color = 'var(--danger)';
           nameEl.textContent = query.length > 40 ? query.substring(0, 37) + '...' : query;
           detail.textContent = 'No coincide con ningún registro.';
           alertCount++;
           logScan('DENEGADO', query, now);
           setTimeout(() => { isProcessing = false; }, 3000);
        }
      }
      
      localStorage.setItem('hw_alerts', alertCount);
      updateStats();
    }

    function linkAndAdmit() {
        const select = document.getElementById('link-guest-select');
        const selectedFullName = select.value;
        const currentUrl = select.getAttribute('data-url');

        if (!selectedFullName) {
            alert("Debes seleccionar un nombre de la lista.");
            return;
        }

        // Guardar mapeo
        urlCache[currentUrl] = selectedFullName;
        localStorage.setItem('hw_url_cache', JSON.stringify(urlCache));

        // Registrar entrada
        const guest = registeredGuests.find(g => g.fullName === selectedFullName);
        const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        
        if (guest) {
            guest.entered = true;
            guest.timeEntered = now;
            localStorage.setItem('hw_guests', JSON.stringify(registeredGuests));
            logScan('ACCESO', guest.fullName, now);
        }

        // Actualizar UI visualmente a Verde
        const box = document.getElementById('result-box');
        box.className = 'result-box valid';
        document.getElementById('res-icon').innerHTML = '<i class="fa-solid fa-circle-check" style="color:var(--success)"></i>';
        document.getElementById('res-status').textContent = 'Vinculado y Autorizado';
        document.getElementById('res-status').style.color = 'var(--success)';
        document.getElementById('res-name').textContent = guest.fullName;
        document.getElementById('res-detail').textContent = 'El código QR ha sido enlazado a esta persona.';
        
        document.getElementById('link-ui').style.display = 'none';
        updateStats();

        setTimeout(() => { isProcessing = false; }, 3000);
    }

    function cancelLink() {
        document.getElementById('link-ui').style.display = 'none';
        
        const box = document.getElementById('result-box');
        box.className = 'result-box invalid';
        document.getElementById('res-icon').innerHTML = '<i class="fa-solid fa-circle-xmark" style="color:var(--danger)"></i>';
        document.getElementById('res-status').textContent = 'Vinculación Cancelada';
        document.getElementById('res-status').style.color = 'var(--danger)';
        document.getElementById('res-name').textContent = '';
        document.getElementById('res-detail').textContent = 'Puedes volver a escanear.';
        
        setTimeout(() => { isProcessing = false; }, 1500);
    }

    function logScan(tipo, nombre, hora) {
      scanLogs.unshift({ tipo, nombre, hora });
      if (scanLogs.length > 60) scanLogs.pop();
      localStorage.setItem('hw_logs', JSON.stringify(scanLogs));
    }

    function handleCSVFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const text = evt.target.result;
        const lines = text.split(/\r\n|\n/).filter(l => l.trim().length > 0);
        if (lines.length < 2) return alert("El archivo CSV no contiene suficientes filas.");

        const headers = lines[0].split(',').map(h => h.trim().toLowerCase());
        let fnIdx = headers.findIndex(h => h.includes('nombre'));
        let lnIdx = headers.findIndex(h => h.includes('apellido'));
        if (fnIdx === -1) fnIdx = 1; 
        if (lnIdx === -1) lnIdx = 2;

        const newGuests = [];
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(',').map(c => c.replace(/"/g, '').trim());
          const full = `${cols[fnIdx] || ''} ${cols[lnIdx] || ''}`.trim();
          if (full.length > 2) newGuests.push({ firstName: cols[fnIdx]||'', lastName: cols[lnIdx]||'', fullName: full, entered: false, timeEntered: null });
        }
        saveImportedList(newGuests);
      };
      reader.readAsText(file);
    }

    function processPastedText() {
      const val = document.getElementById('paste-input').value.trim();
      if (!val) return alert("Pega primero la lista de nombres.");
      const lines = val.split('\n').filter(l => l.trim().length > 0);
      const newGuests = [];
      lines.forEach(line => {
        const parts = line.split('\t').map(p => p.trim());
        const full = parts.length >= 2 ? `${parts[0]} ${parts[1]}`.trim() : line.trim();
        if (full.length > 2) newGuests.push({ firstName: parts[0]||'', lastName: parts[1]||'', fullName: full, entered: false, timeEntered: null });
      });
      saveImportedList(newGuests);
    }

    function saveImportedList(list) {
      registeredGuests = list;
      localStorage.setItem('hw_guests', JSON.stringify(registeredGuests));
      alert(`¡Éxito! Se cargaron ${registeredGuests.length} asistentes.`);
      updateStats();
      switchTab('scanner', document.querySelector('.nav-btn'));
    }

    function clearData() {
      if (confirm("¿Estás seguro de que deseas borrar toda la lista?")) {
        localStorage.clear();
        registeredGuests = []; scanLogs = []; urlCache = {}; alertCount = 0;
        updateStats(); alert("Datos reiniciados.");
      }
    }

    function renderList() {
      const cont = document.getElementById('guest-items-container');
      if (registeredGuests.length === 0) return cont.innerHTML = '<div style="padding: 25px; text-align:center; color:#8898aa;">Vacío</div>';
      cont.innerHTML = registeredGuests.map(g => `
        <div class="guest-item ${g.entered ? 'in' : ''}">
          <div><div class="guest-name">${g.fullName}</div><div class="guest-sub">${g.entered ? 'Adentro - ' + g.timeEntered : 'Sin ingresar'}</div></div>
          <div>${g.entered ? '<i class="fa-solid fa-check" style="color:var(--success)"></i>' : '<i class="fa-solid fa-clock" style="color:#8898aa"></i>'}</div>
        </div>
      `).join('');
    }

    function renderLogs() {
      const cont = document.getElementById('scan-log-container');
      if (scanLogs.length === 0) return cont.innerHTML = '<div style="padding: 25px; text-align:center; color:#8898aa;">Vacío</div>';
      cont.innerHTML = scanLogs.map(l => `
        <div class="guest-item">
          <div><div class="guest-name" style="font-size:0.85rem;">${l.nombre}</div><div class="guest-sub">${l.tipo} • ${l.hora}</div></div>
          <span style="font-size:0.75rem; font-weight:700; color:${l.tipo === 'ACCESO' ? 'var(--success)' : (l.tipo === 'DUPLICADO' ? 'var(--warning)' : 'var(--danger)')};">${l.tipo}</span>
        </div>
      `).join('');
    }

    updateStats();
  </script>
</body>
</html>
